services:
  # ---------------------------------------------------------------------------
  # Backend Web Service (Django REST API)
  # ---------------------------------------------------------------------------
  - type: web
    name: club-management-backend
    env: python
    region: oregon
    plan: free
    rootDir: club_management_backend
    buildCommand: ./build.sh
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DB_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com

  # ---------------------------------------------------------------------------
  # Frontend Static Site (Flutter Web)
  # ---------------------------------------------------------------------------
  - type: web
    name: club-management-frontend
    env: static
    plan: free
    rootDir: club_management_app
    buildCommand: bash build.sh
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        sync: false
